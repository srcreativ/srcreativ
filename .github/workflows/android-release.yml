name: Android APK release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Prepare minimal Android web shell
        run: npm run build && npx cap sync android && node scripts/prune-android-assets.mjs
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release-keystore.jks
          cat > android/keystore.properties <<'EOF'
          storeFile=release-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - run: chmod +x android/gradlew
      - name: Build named signed APK
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then VERSION="${{ inputs.version }}"; fi
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{ printf "%d", $1 * 1000000 + $2 * 1000 + $3 }')
          ./gradlew assembleRelease --no-daemon --console=plain -PreleaseVersionName="$VERSION" -PreleaseVersionCode="$VERSION_CODE"
          APK_NAME="SR-Studio-Admin-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/${APK_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: SR-Studio-Admin-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}
      - name: Publish GitHub Release
        run: |
          TAG="android-v${{ steps.version.outputs.version }}"
          gh release create "$TAG" "android/app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}#${{ steps.version.outputs.apk_name }}" --title "SR Studio Admin ${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
